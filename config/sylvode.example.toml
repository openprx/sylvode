# Sylvode configuration — annotated example.
#
# Copy this file to config/sylvode.toml, replace every replace_with_* placeholder, and start the
# services from the directory that holds it, or pass --config <path>.
#
#     cp config/sylvode.example.toml config/sylvode.toml
#     $EDITOR config/sylvode.toml
#
# This file configures the API, the worker, the MCP server and the sylvode command line; each
# binary reads the sections it needs and ignores the rest. The few environment variables the API
# reads (plugin package switches, the location of collab-isolated-apply-worker) are listed in
# docs/configuration.md, which describes every key below. A missing file is a startup error: the
# services never invent defaults for a database URL or a signing key.
#
# Every replace_with_* value below is rejected by validation on purpose, as are empty strings and
# unexpanded ${...} templates. Validation reports all unusable values at once, so one round of
# edits fixes the whole file.
#
# Keys marked REQUIRED must be present for the binaries named next to them, and are checked when
# one of those binaries starts — a deployment that runs only the MCP server needs no [database]
# and no [auth] at all, and is never asked to invent a database URL or a signing key it does not
# use. A value that IS written down is checked for shape at startup either way, whichever binary
# reads the file. Everything else is optional and falls back to the default recorded in its
# comment.


# ---------------------------------------------------------------------------------------------
# [server] — identity and listen address of the HTTP binaries.
#
# Optional as a whole. Read by the api; the worker opens no listener and uses app_name only in its
# log lines and bind_addr only for the allow_insecure_cookies check below. Leaving these out keeps
# the built-in defaults (api: 0.0.0.0:8081, name: the binary's own name).
# ---------------------------------------------------------------------------------------------
[server]
# Service name used in logs and in the health payload. Default: the binary's own name.
# app_name = "api"

# Listen address as host:port. Default: the binary's own default.
# bind_addr = "0.0.0.0:8081"

# Reverse proxies (IP addresses or CIDR blocks) whose X-Forwarded-For / X-Real-IP headers the api
# believes when it needs the real client address (per-address rate limits). A request from any
# other peer has those headers ignored, so a direct caller cannot forge its address. Setting this
# REPLACES the default. Default: loopback (127.0.0.0/8, ::1/128) and 172.16.0.0/12, the range
# Docker hands to the compose bridge network the bundled nginx runs on. Podman and custom
# networks use other ranges: list yours here.
# trusted_proxies = ["127.0.0.0/8", "::1/128", "172.16.0.0/12"]

# The address people reach this server at, as an absolute http or https origin without a path.
# Links in e-mails start with it. Required when [email] is enabled.
# public_url = "https://sylvode.example.com"


# ---------------------------------------------------------------------------------------------
# [database] — PostgreSQL connection and pool shape.
#
# Read by the api and the worker. The MCP server reaches the API over HTTP and opens no
# connection of its own, so an MCP-only deployment can delete this whole section.
# ---------------------------------------------------------------------------------------------
[database]
# REQUIRED by the api and the worker; both refuse to start without it. Full connection URL,
# password included. Never logged: it is redacted in every Debug and error output.
url = "postgres://openpr:replace_with_postgres_password@localhost:5432/openpr"

# Pool bounds. min_connections must not exceed max_connections.
max_connections = 20          # default: 20
min_connections = 2           # default: 2

# Pool timeouts, in whole seconds. Each must be at least 1.
connect_timeout_seconds = 5   # default: 5
idle_timeout_seconds = 30     # default: 30
acquire_timeout_seconds = 5   # default: 5


# ---------------------------------------------------------------------------------------------
# [auth] — token signing and issuance.
#
# Read by the api and the worker. The MCP server presents a bot token the API issued and signs
# nothing itself, so an MCP-only deployment can delete this whole section.
# ---------------------------------------------------------------------------------------------
[auth]
# REQUIRED by the api and the worker; both refuse to start without it. Signs every access and
# refresh token in the deployment. Minimum 16 characters; 64 hex characters is the
# recommendation. Generate one with:
#
#     openssl rand -hex 32
#
# Rotating this value invalidates every issued token. Never logged.
jwt_secret = "replace_with_a_64_character_hex_secret"

# Token lifetimes in seconds. Both must be greater than 0.
access_ttl_seconds = 1296000   # default: 1296000 (15 days)
refresh_ttl_seconds = 1728000  # default: 1728000 (20 days)

# Drops the `Secure` attribute from the access/refresh/clear auth cookies. Default: false (cookies
# are always Secure, even over plain HTTP). ONLY for local development over plain http://: the api
# refuses to start with this set to true unless [server].bind_addr also resolves to a loopback
# host (127.0.0.1 / ::1 / localhost) — a listener anything off-machine can reach must never ship an
# insecure cookie.
# allow_insecure_cookies = true


# ---------------------------------------------------------------------------------------------
# [logging] — log filter, format and stream. The api, worker and mcp-server do not read RUST_LOG.
# ---------------------------------------------------------------------------------------------
[logging]
# tracing-subscriber filter directives. Validated at startup, so a typo fails fast instead of
# silently producing a silent service. Default: "<service>=info,tower_http=info".
# filter = "api=info,tower_http=info,sea_orm=warn"

# "json" for log shippers, "text" for a terminal. Default: json.
format = "json"

# Stream the log goes to: "stderr" or "stdout". Default: stderr.
#
# Stderr is the default because it is never a data channel: a log line written there cannot
# corrupt whatever a binary writes to stdout, and container runtimes and init systems capture the
# two streams identically, so nothing is lost by preferring it.
#
# The MCP server's stdio transport frames JSON-RPC on stdout, where one log line breaks the
# session. The mcp-server and the sylvode command line therefore always log to stderr, whatever
# this setting says; one file configures several binaries, and the choice the api makes here must
# not be able to break the MCP server.
output = "stderr"


# ---------------------------------------------------------------------------------------------
# [storage] — where uploaded objects live.
# ---------------------------------------------------------------------------------------------
[storage]
# "local" or "s3". Default: local.
backend = "local"

# Root directory of the local backend. Ignored when backend = "s3". Default: "./uploads".
dir = "./uploads"

# [storage.s3] is REQUIRED when backend = "s3", and left unread otherwise — you can keep it
# filled in while running on local storage and switch by editing one line above.
# [storage.s3]
# endpoint = "https://s3.eu-central-1.amazonaws.com"  # REQUIRED, http:// or https://
# bucket = "sylvode-uploads"                           # REQUIRED, 3-63 chars, lowercase
# region = "us-east-1"                                # default: us-east-1
# access_key_id = "replace_with_s3_access_key_id"          # REQUIRED, never logged
# secret_access_key = "replace_with_s3_secret_access_key"  # REQUIRED, never logged
# session_token = "replace_with_s3_session_token"          # optional, for temporary credentials


# ---------------------------------------------------------------------------------------------
# [audit] — retention for metadata-only bot operation records.
# ---------------------------------------------------------------------------------------------
[audit]
# Delete records older than this many days. Default: 30. Accepted range: 1..=3650.
operation_log_retention_days = 30


# ---------------------------------------------------------------------------------------------
# [api] — limits of the API process. Read by the api.
# ---------------------------------------------------------------------------------------------
[api]
# Open GET /api/v1/bot/change-hints streams (push hints for bot tokens) in one api process; a
# bot may also hold at most 64 of its own. Beyond the limit the answer is 429 with Retry-After.
# Default: 4096. Accepted range: 1..=100000.
max_change_hint_streams = 4096


# ---------------------------------------------------------------------------------------------
# [ai_tasks] — how long work handed to a bot may run. Read by the api and the worker.
# ---------------------------------------------------------------------------------------------
[ai_tasks]
# A delivered task that is neither completed nor failed by the receiver within this many seconds
# is taken back by the worker: re-queued while attempts remain, failed otherwise. Keep it well
# above the longest time a bot needs to finish one task, including any wait before it starts.
# Default: 3600. Accepted range: 60..=604800.
processing_timeout_secs = 3600
# Each acknowledge, progress report or runner heartbeat moves an active task's deadline to this
# many seconds from now. Default: 1800. Accepted range: 60..=86400.
lease_extension_secs = 1800
# No extension moves a task's deadline past this many seconds after it was picked up. Must not be
# below processing_timeout_secs. Default: 86400. Accepted range: processing_timeout_secs..=604800.
max_processing_secs = 86400
# Deepest hop of a bot-to-bot chain. A task a human or an inbound alert starts is depth 0; a task
# a bot causes while it runs a task (a mention or an assignment) is one deeper. A hop beyond this
# depth, or one that brings the same bot into a chain twice for the same work item, creates no
# task and is recorded as an `ai_task.chain_refused` event. Default: 3. Accepted range: 1..=10.
max_chain_depth = 3
# Delivery of tasks to runners. The defaults are the behaviour without these keys: a new client
# for every delivery, one delivery at a time.
# Deliver through one long-lived client pair that reuses connections and checks the address of
# every new connection against the [outbound] rules. Default: false.
delivery_pool = false
# Deliveries that run at once; each bot's tasks are still delivered in order, one at a time.
# 1 delivers a batch serially. Default: 1. Accepted range: 1..=64.
delivery_concurrency = 1
# Requests in flight to one runner address at once (delivery_pool only). Default: 1.
# Accepted range: 1..=64.
per_runner_concurrency = 1
# The worker picks up at most its --concurrency times this many tasks per tick. Default: 10.
# Accepted range: 1..=1000.
lane_batch = 10
# An idle pooled connection is closed after this many seconds (delivery_pool only). Default: 30.
# Accepted range: 1..=3600.
pool_idle_timeout_secs = 30
# Idle pooled connections kept per runner address (delivery_pool only). Default: 4.
# Accepted range: 1..=64.
pool_max_idle_per_host = 4
# TCP keepalive interval of pooled connections in seconds, 0 for none (delivery_pool only).
# Default: 30. Accepted range: 0..=3600.
tcp_keepalive_secs = 30


# ---------------------------------------------------------------------------------------------
# [migrations] — escape hatches of the migration runner. Both default to false, which is the
# setting a healthy deployment runs with. Turn one on deliberately, then turn it back off.
# ---------------------------------------------------------------------------------------------
[migrations]
# Re-execute every migration once, reporting failures without aborting. Safe on a live database:
# a failure never downgrades a ledger row that already records a success.
replay = false

# Start even though a migration failed or the schema check found a gap. The degraded path for
# getting a service up to inspect it. The failure is still recorded and logged.
continue_on_error = false


# ---------------------------------------------------------------------------------------------
# [outbound] — what the webhook and AI-task delivery paths are allowed to call.
#
# Outbound requests to private and loopback addresses are blocked by default, so a webhook
# cannot be pointed at the cluster's own metadata service or at an internal admin port.
# ---------------------------------------------------------------------------------------------
[outbound]
# Hosts exempt from the private address check, as "host" or "host:port". Matched literally and
# case-insensitively — no wildcards, no URLs, no paths. Default: empty.
allowed_hosts = []
# allowed_hosts = ["worker.internal", "hooks.example.com:8443"]

# Disables the private address check entirely. Only for a closed network you control end to end.
# Default: false.
allow_private = false


# ---------------------------------------------------------------------------------------------
# [flow] — Sylvode Flow. Read by the API and the worker; every key is optional.
# ---------------------------------------------------------------------------------------------
# [flow]
# How many times the event dispatcher attempts one Flow event delivery before giving up.
# Default: 10. Must be greater than 0.
# dispatch_max_attempts = 10
#
# Browser origins (scheme://host[:port], no path) allowed to open live collaboration sessions.
# A ticket request and the WebSocket upgrade are both refused unless their Origin header is
# listed here. Default: empty, which refuses every live editing session; list the origin the
# web UI is served from.
# collab_allowed_origins = ["https://sylvode.example.com"]
#
# Seconds between two sweeps that fail conversion jobs left `started` for more than 15 minutes
# (their run crashed or was abandoned), so they can be retried. The API also sweeps once at
# startup. Default: 60. Must be between 1 and 86400.
# conversion_reap_interval_secs = 60
#
# EXPERIMENTAL, off by default. Whether the collab write window may decide a write's structural
# limits incrementally, from the facts of the page and the units the update touched, instead of
# running the full computation for every write. The limits enforced are the same. With it on, the
# worker also refuses an update that rewrites the logical id of an existing tree node. An update
# whose tree ops name a parent that does not exist is refused with either setting. It is off by
# default because a crafted update can make one text so costly that the page's later writes are all
# refused, which the full computation never allows; the hardening is not finished.
# Default: false.
# incremental_window = false
#
# CPU time, in milliseconds, that the worker's unmetered setup (load of the page, prewarm and the
# facts of the page that the incremental window starts from) may consume before it gives up on the
# facts and the write is decided by the full window. The limit is machine-dependent: the default
# was calibrated on a runner about 3.6 times slower than a developer machine; a host that is
# slower than that may raise it so its largest honest pages stay on the incremental window. The
# worker's setup is cut by a wall timeout of 5 seconds whatever this value is, so the accepted
# range is 500 to 4000. Default: 2500.
# setup_cpu_budget_ms = 2500
#
# Largest file, in bytes, a Page body asset may have. Default: 52428800 (50 MiB), which is also
# the largest accepted value. Must be at least 1.
# body_asset_max_bytes = 52428800


# ---------------------------------------------------------------------------------------------
# [mcp] — MCP server. Optional for the API and the worker.
#
# Every call this server makes to the Sylvode API is made with a workspace bot token, and which
# bot that is depends on the transport:
#
#   stdio          One person runs one process from their own MCP client, so the identity is
#                  mcp.bot_token below. That is already one account per process.
#   http / sse     A shared listener, where one configured bot would make every caller
#                  indistinguishable. Each request instead presents its *own* caller's bot token
#                  in `Authorization: Bearer opr_...`, which this server forwards to the API
#                  unchanged; the API authenticates it and the audit trail records that bot.
#                  A request without one is answered 401 (only /health is exempt), so these
#                  deployments need no mcp.bot_token at all.
#
# This server never verifies a token itself. It has no signing key and no bot registry; holding
# either would mean a compromised MCP server could mint identities. It forwards and the API
# decides.
# ---------------------------------------------------------------------------------------------
[mcp]
# Base URL of the Sylvode API the MCP server talks to. Default: http://localhost:8081.
# api_url = "http://localhost:8081"

# REQUIRED for transport = "stdio" and for the CLI subcommands, which have no per-request
# credential to act on. NOT used, and not needed, by transport = "http" or "sse".
# Workspace bot token; must carry the opr_ prefix. Create one in the workspace's bot settings.
# Never logged.
# bot_token = "replace_with_opr_bot_token"

# REQUIRED for transport = "stdio" and for the CLI subcommands. Workspace the calls are scoped to.
# Must be a real, non-nil UUID. NOT used, and not needed, by transport = "http" or "sse": every
# networked call acts in the workspace its caller's own bot token belongs to.
# workspace_id = "replace_with_workspace_uuid"

# "stdio", "http" or "sse". Default: stdio, which is a pipe pair owned by the parent process and
# therefore carries no inbound authentication question.
transport = "stdio"

# Listen address for the http and sse transports. Default: 127.0.0.1:8090. Binding this to a
# reachable address does not publish an anonymous port: every request on these transports has to
# present its caller's own bot token, and the process holds no identity of its own to fall back
# to, so an unauthenticated caller can reach nothing but /health.
# bind_addr = "127.0.0.1:8090"

# Delegated access (OAuth). Set all three or none: a partial set refuses to start and names what
# is missing. Without them this server accepts workspace bot tokens only and answers 401 to a
# delegated `sva_` token.
#   oauth_issuer           The issuer of the authorization server; equal to [oauth] issuer.
#   oauth_resource         The URL that receives JSON-RPC posts, as a client reaches it; equal to
#                          [oauth] mcp_resource.
#   oauth_forward_secret   The credential this server presents to the API when it forwards a
#                          delegated token; equal to [oauth] internal_forward_secret. At least 32
#                          bytes. Never logged.
# oauth_issuer = "https://sylvode.example.com"
# oauth_resource = "https://sylvode.example.com/mcp"
# oauth_forward_secret = "replace_with_at_least_32_random_bytes"

# Which tools the MCP server lists. "search" (default): sylvode_overview, sylvode_search,
# sylvode_read, sylvode_write and the task tools; every other tool is found with sylvode_search
# and called through sylvode_read or sylvode_write. "full": the whole registry is listed and
# callable by name. `serve --tools search|full` overrides this for stdio; on http and sse a
# connection chooses with `?tools=` or the `X-Sylvode-Tool-Mode` header and falls back to this
# value. Connected (OAuth) applications ignore it.
# tool_mode = "search"

# Whether the bot may use write tools. Default: true. false disables every write tool except the
# task lifecycle tools (sylvode_task_get, _ack, _progress, _complete, _fail), which a runner bot
# needs: sylvode_write answers that writes are disabled, and in full mode, on every transport
# and in the command line (`sylvode tools call`, `sylvode projects create`, ...) a tool the catalogue
# marks as writing is refused before any request. Reads are not affected.
# allow_write_call = true

# Whether the MCP server offers push (`subscriptions/listen`). Default: true. false stops the
# server declaring `tools.listChanged` and `resources.subscribe` and answers `subscriptions/listen`
# with "method not found"; every read keeps working. The rollback lever for push.
# listen = true

# `Origin` values the MCP routes accept, exact `scheme://host[:port]`. Default: none. A request
# without an `Origin` header is always served (agent CLIs and servers send none); a request whose
# `Origin` is present and not listed is refused with 403 (DNS rebinding defence).
# allowed_origins = ["https://app.example.com"]

# Open listen streams the http transport accepts in total. Default: 10000. One credential may hold
# 1000 of them.
# max_listen_streams = 10000


# ---------------------------------------------------------------------------------------------
# [oauth] — authorization server for the API and the MCP server. Optional; off by default.
#
# Without `issuer` the feature does not exist: the discovery documents answer 404 and no
# delegated token is accepted. With it, Sylvode lets the registered client (Ramflux) obtain
# short-lived, revocable access to one workspace on behalf of a signed-in person, who chooses the
# workspace, the projects and the access on a consent page. Only the issuer is required.
# ---------------------------------------------------------------------------------------------
[oauth]
# The public origin of this Sylvode, exactly as clients reach the web UI: an https URL with no
# path, for example "https://sylvode.example.com". It appears byte for byte in the metadata and in
# every authorization response.
# issuer = "https://sylvode.example.com"

# Identifier of the API as a protected resource. Default: "<issuer>/api".
# api_resource = "https://sylvode.example.com/api"

# Identifier of the MCP server as a protected resource, the URL that receives JSON-RPC posts.
# Required, together with internal_forward_secret, when the MCP server serves delegated callers;
# must equal [mcp] oauth_resource.
# mcp_resource = "https://sylvode.example.com/mcp"

# Credential the MCP server presents when it forwards a delegated token to the API. At least 32
# bytes; must equal [mcp] oauth_forward_secret. Never logged.
# internal_forward_secret = "replace_with_at_least_32_random_bytes"

# Local development only: allow an http issuer on 127.0.0.1 or [::1]. Refused for any other host.
# allow_insecure_loopback_issuer = false

# Lifetimes and limits. Defaults shown; the accepted range is in brackets.
# access_token_ttl_seconds = 600              # [60, 3600]
# refresh_token_idle_days = 30                # [1, 90] unused refresh tokens expire
# grant_max_lifetime_days = 365               # [1, 730] a connection ends after this, always
# authorization_code_ttl_seconds = 60         # [10, 600]
# max_active_grants_per_user_client = 10      # [1, 50]
# event_feed_retention_days = 7               # [1, 30]
# event_backfill_max_events = 1000            # [100, 10000]
# event_backfill_max_age_hours = 72           # [1, 168]
# max_streams_per_process = 2000              # [10, 20000]


# ---------------------------------------------------------------------------------------------
# [inbound] — the alert chain: external security products post events to
# POST /api/v1/inbound/events with a per-project source credential. Optional; off by default.
#
# With enabled = false the endpoint answers 503 to every caller. Sources and alert rules are
# managed by workspace owners and admins through the API. Defaults shown; the accepted range is in
# brackets.
# ---------------------------------------------------------------------------------------------
[inbound]
enabled = false
# max_body_bytes = 65536                          # [4096, 262144]
# signature_tolerance_secs = 300                  # [30, 900] allowed clock difference of a signed request
# auth_failures_per_minute_per_ip = 30            # [1, 1000]
# max_active_alert_tasks_per_workspace = 5        # [1, 100] bot tasks that alerts may have active at once
# max_alerts_per_rule_per_hour = 60               # [1, 10000] work items one rule may open per hour
# event_retention_days = 30                       # [1, 365] how long stored events are kept
# followup_interval_secs = 2                      # [1, 60] how often the worker looks for ended alert tasks


# ---------------------------------------------------------------------------------------------
# [email] — notification e-mails over SMTP (plain text only). Optional; off by default.
#
# With enabled = false nothing is sent and the notification settings page says that e-mail is not
# set up. With enabled = true, smtp_host and from are required, and so is [server] public_url.
# The worker sends the e-mails; it connects only to addresses the [outbound] rules allow, so a
# relay on a private or loopback address has to be listed in [outbound] allowed_hosts.
# Validation messages name the key, never the value. The password is never logged.
# ---------------------------------------------------------------------------------------------
[email]
enabled = false
# smtp_host = "smtp.example.com"
# smtp_port = 587                       # default: 587 for starttls, 465 for implicit, 25 for none
# tls = "starttls"                      # starttls | implicit | none (none only for a loopback host)
# username = "sylvode"                  # optional; with password, authenticates to the server
# password = "replace_with_smtp_password"
# from = "Sylvode <sylvode@example.com>"
# ca_file = "/etc/sylvode/smtp-ca.pem"  # optional PEM added to the trust roots (a private CA)
# digest_hour_utc = 8                   # [0, 23] hour after which each day's digest is sent
