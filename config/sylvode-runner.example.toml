# Example configuration for the Sylvode runner, sylvode-runner (built from apps/runner in this
# repository), pointed at this deployment. docker-compose.yml mounts it at
# /etc/sylvode-runner/config.toml in the optional `runner` service.
#
# The `events` a route may match are the ones a webhook subscription can actually request:
# see WEBHOOK_EVENTS in apps/api/src/entities/webhook.rs.

[server]
listen = "0.0.0.0:9090"

[security]
# Must equal the `secret` of the webhook subscription created in Sylvode. Both the API's own
# deliveries and the worker's AI-task dispatch sign the exact request body with it.
webhook_secrets = ["replace_with_webhook_secret"]
allow_unsigned = false

[features]
tunnel_enabled = false

[runtime]
cli_max_concurrency = 1
http_timeout_secs = 15
tunnel_reconnect_backoff_max_secs = 60

# The bots' tokens for the Sylvode API: a `runner` agent reads and reports its tasks with them, and a
# forwarding agent that cannot hand a delivery over fails the task with the token of the task's bot
# (POST /api/v1/ai/tasks/{task_id}/fail). A token works only for the tasks of the bot that owns it:
# set `bot_id` to that bot and add a [[ai_task_callback.bots]] entry (bot_id, token, surface) for
# every other bot this receiver serves. Off by default. See apps/runner/README.md.
[ai_task_callback]
enabled = false
# The API as the runner container reaches it (the `api` service in docker-compose.yml).
api_url = "http://api:8080"
# Bearer token of the bot that is the tasks' AI participant.
token = "replace-with-the-bot-token-of-the-ai-participant"
surface = "rest"
max_attempts = 3
retry_delay_ms = 1000

# Bot work: Sylvode marks a delivery with `bot_context.is_bot_task = true` when the webhook's
# bot user is the assignee or is mentioned.
[[agents]]
id = "bot-log"
name = "Bot Task Log"
agent_type = "custom"
message_template = "{event} {project} {key} {title}"

[agents.route]
events = ["issue.assigned", "issue.state_changed", "comment.created"]

[agents.custom]
command = "echo"
args = ["{message}"]

# AI tasks the worker dispatches carry `task_id` and `ai_participant_id` instead of an
# `event`, so this route matches on the bot rather than on an event name.
[[agents]]
id = "ai-task-log"
name = "AI Task Log"
agent_type = "custom"
message_template = "ai_task {project_id} {issue_id} {reason}"

[agents.route]
bot_agent_types = ["claude-code"]

[agents.custom]
command = "echo"
args = ["{message}"]

# A `runner` agent executes the tasks of a bot that is connected to a project in Sylvode; the
# connection issues this block. It needs [ai_task_callback] enabled with a token for the bot
# registered for mcp_stdio, and at least one allowed root.
#
# [runner]
# allowed_roots = ["~/work"]
#
# [[ai_task_callback.bots]]
# bot_id = "00000000-0000-0000-0000-000000000000"
# workspace_id = "00000000-0000-0000-0000-000000000000"  # the workspace the bot belongs to
# token = "replace-with-the-bot-token"
# surface = "mcp_stdio"
#
# [[agents]]
# id = "00000000-0000-0000-0000-000000000000"
# name = "Build bot"
# agent_type = "runner"
# [agents.route]
# bot_ids = ["00000000-0000-0000-0000-000000000000"]
