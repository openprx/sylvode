[server]
listen = "0.0.0.0:9090"

[security]
webhook_secrets = ["your-secret-here"]
allow_unsigned = true  # dev only

# Feature flags: all new Phase-B paths default OFF.
[features]
tunnel_enabled = false
cli_enabled = false
callback_enabled = false

# Runtime guardrails
[runtime]
cli_max_concurrency = 1
http_timeout_secs = 15
tunnel_reconnect_backoff_max_secs = 60

# Optional: tunnel config (Phase B minimal viable)
[tunnel]
enabled = false
# supports ws:// and wss://, production should use wss://
url = "wss://sylvode.example.com/api/v1/agent-tunnel"
# required: the id the control plane registered for this agent; there is no default
agent_id = "vano-qa"
# sent as Authorization: Bearer <token>
auth_token = "opr_xxx"
# auto reconnect interval after disconnect/failure
reconnect_secs = 3
# heartbeat send interval
heartbeat_secs = 20
# optional: sign outgoing envelopes and verify incoming envelopes
hmac_secret = "shared-hmac-secret"
# if true, inbound tunnel messages without sig are rejected
require_inbound_sig = false

[[agents]]
id = "david"
name = "David"
agent_type = "openclaw"
message_template = "🔔 [{project}] {event}: {key} {title}\n👤 {actor} | Trigger: {reason}"

[agents.openclaw]
command = "openclaw"
args = ["message", "send"] # runs: openclaw message send --channel ... --target ... --message ...
channel = "signal"
target = "uuid:your-user-uuid"

[[agents]]
id = "vano-cli"
name = "Vano CLI"
agent_type = "cli"
# A cli agent is given prompt_template (below); message_template does not apply.

# Optional scenario route constraints. When present, the Sylvode bot task or
# worker AI task must match these fields before the agent is selected.
# Empty lists mean "no constraint" for that dimension.
[agents.route]
bot_agent_types = ["cli"]
project_types = ["code_delivery"]
# Values Sylvode sends: assigned, created, status_changed, mentioned, completed,
# failed (webhook deliveries) and assigned, mention, proposal_vote, manual
# (worker AI tasks). Any other value refuses start-up.
trigger_kinds = ["assigned", "mentioned"]
# Event routing. Only events a webhook subscription can request are ever
# delivered; see WEBHOOK_EVENTS in the Sylvode API.
# events = ["issue.assigned", "comment.created"]
# form_keys = ["order", "print_job"]

[agents.cli]
executor = "codex" # codex | claude-code | opencode
workdir = "/path/to/your/repository"
timeout_secs = 900
max_output_chars = 12000
prompt_template = "Fix issue {issue_id}: {title}\nContext: {reason}"
callback = "mcp" # mcp | api
callback_url = "http://127.0.0.1:8090/mcp/rpc"
callback_token = "opr_xxx"
update_state_on_start = "in_progress"
update_state_on_success = "done"
update_state_on_fail = "todo"

# --- MCP closed-loop example (AI reads full issue context via MCP) ---

[[agents]]
id = "ai-fixer"
name = "AI Issue Fixer"
agent_type = "cli"

[agents.cli]
executor = "claude-code"
workdir = "/path/to/your/repository"
timeout_secs = 900
max_output_chars = 12000
prompt_template = "Fix issue {issue_id}: {title}\nContext: {reason}"

# MCP closed-loop: AI updates issue state directly via MCP tools,
# so we skip the callback state update to avoid duplication.
skip_callback_state = true
callback = "mcp"
callback_url = "http://127.0.0.1:8090/mcp/rpc"
callback_token = "opr_xxx"

# Path to an MCP config for claude-code (--mcp-config flag). Setting it (or
# mcp_instructions, or env_vars) also appends the default MCP instructions to
# the prompt. If omitted, claude-code uses its global ~/.claude.json MCP config.
mcp_config_path = "/path/to/mcp-config.json"

# Custom MCP instructions appended to the prompt. If omitted, a sensible
# default is used that instructs the AI to read/write via Sylvode MCP tools.
# mcp_instructions = "Use work_items.get to read issue {issue_id}, then fix it."

# Extra environment variables injected into the executor subprocess.
# The Sylvode MCP server reads its API URL, bot token and workspace from its
# own config file (mcp-server serve --config ...), not from these variables.
# [agents.cli.env_vars]
# HTTPS_PROXY = "http://proxy.internal:3128"
