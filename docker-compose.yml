version: "3.9"

# Application settings come from a TOML configuration file, mounted read-only at
# /app/config/sylvode.toml and named
# explicitly with --config. `scripts/start.sh` generates both files; `config/sylvode.example.toml`
# is the annotated reference.
#
# Two files rather than one. api and worker are a single trust domain: same database, same signing
# key, and a split file could let the two drift apart. The MCP server is the agent facing surface
# that is published on a port, and it needs neither the database URL nor the JWT signing key --
# it reaches the API over HTTP with a workspace bot token. Handing it the signing key would turn a
# compromise of that surface into the ability to forge any user's token, so it gets a file that
# carries only [logging] and [mcp]. The lazy validation of [database] and [auth] is what makes an
# MCP-only file a complete configuration.
#
# Compose passes the API its two optional plugin rollout flags. Other environment values
# configure the PostgreSQL image or Compose itself, including host ports and base images.

services:
  postgres:
    image: postgres:18
    # The postgres image initialises itself from these; they are read by the image's entrypoint,
    # not by Sylvode. POSTGRES_PASSWORD must match the password inside database.url in
    # config/sylvode.compose.toml (or the legacy config/openpr.compose.toml).
    environment:
      POSTGRES_DB: openpr
      POSTGRES_USER: openpr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for PostgreSQL}
    expose:
      - "5432"
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker; mount the parent directory.
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpr -d openpr"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - openpr-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        RUNTIME_BASE: ${SYLVODE_RUNTIME_BASE:-debian:bookworm-slim}
        APP_BIN: api
    command: ["/app/api", "--config", "/app/config/sylvode.toml"]
    environment:
      SV_FORM_PLUGIN_PACKAGES_ENABLED: "${SV_FORM_PLUGIN_PACKAGES_ENABLED:-0}"
      SV_FORM_PLUGIN_LAYOUTS_ENABLED: "${SV_FORM_PLUGIN_LAYOUTS_ENABLED:-0}"
    ports:
      - "${SYLVODE_BIND_HOST:-127.0.0.1}:${SYLVODE_API_PORT:-8081}:8080"
    volumes:
      # Generated by scripts/start.sh. A missing source file makes the daemon create a directory
      # here and the container then fails to read its configuration, so start.sh checks for that.
      - ${SYLVODE_APP_CONFIG_PATH:-./config/sylvode.compose.toml}:/app/config/sylvode.toml:ro
      # Must match `dir` under [storage] in that file.
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - openpr-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        RUNTIME_BASE: ${SYLVODE_RUNTIME_BASE:-debian:bookworm-slim}
        APP_BIN: worker
    command: ["/app/worker", "--config", "/app/config/sylvode.toml"]
    volumes:
      # The same file the api reads: one database, one signing key, no drift between the two.
      - ${SYLVODE_APP_CONFIG_PATH:-./config/sylvode.compose.toml}:/app/config/sylvode.toml:ro
      # The worker writes attachment package job artifacts through the same storage backend as the
      # api, so it needs the same directory behind [storage] dir.
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openpr-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        RUNTIME_BASE: ${SYLVODE_RUNTIME_BASE:-debian:bookworm-slim}
        APP_BIN: mcp-server
    # --transport and --bind-addr are stated here rather than left to the file: the container has
    # to bind 0.0.0.0 for the other services to reach it, and that requirement belongs to this
    # deployment, not to the file. A flag wins over the file, so the compose stack serves HTTP on
    # 8090 whatever [mcp] transport says.
    #
    # Nothing here holds an inbound secret, because there is none: the http transport serves every
    # request as the caller that made it, and a caller identifies itself with its own workspace bot
    # token in `Authorization: Bearer opr_...`, which this server forwards to the api service for
    # authentication. A request without one is refused with 401, so binding 0.0.0.0 inside the
    # compose network publishes no anonymous surface; only /health answers unauthenticated, which
    # is what the healthcheck below needs.
    command:
      - "/app/mcp-server"
      - "serve"
      - "--config"
      - "/app/config/sylvode.toml"
      - "--transport"
      - "http"
      - "--bind-addr"
      - "0.0.0.0:8090"
    ports:
      - "${SYLVODE_BIND_HOST:-127.0.0.1}:${SYLVODE_MCP_PORT:-8090}:8090"
    volumes:
      # Carries [logging] and [mcp] only -- no database URL and no signing key reach this service.
      - ${SYLVODE_MCP_CONFIG_PATH:-./config/sylvode.compose.mcp.toml}:/app/config/sylvode.toml:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - openpr-network

  frontend:
    build:
      context: ./frontend
      # Dockerfile builds from source; Dockerfile.prebuilt serves an existing
      # ./frontend/build, for hosts that have no bun toolchain.
      dockerfile: ${SYLVODE_FRONTEND_DOCKERFILE:-Dockerfile}
    ports:
      - "${SYLVODE_BIND_HOST:-127.0.0.1}:${SYLVODE_FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - openpr-network

  # The optional Sylvode Webhook receiver, built from this repository (apps/webhook) with
  # `docker compose --profile connectors build webhook`. The image carries /app/sylvode-webhook and
  # the legacy /app/openpr-webhook. A local build is tagged with the image name below, the name
  # releases publish under: compose builds it when no image of that name is present, and
  # `docker compose pull webhook` fetches a published one instead. To run a specific published
  # release, pin it, for example SYLVODE_WEBHOOK_IMAGE=ghcr.io/openprx/sylvode-webhook:<sylvode version>
  # (the image tag is the Sylvode release version). A pre-merge standalone image
  # (ghcr.io/openprx/openpr-webhook, last tag 0.3.3) also needs the command /app/openpr-webhook. Pin a version tag rather than
  # :latest in production. SYLVODE_WEBHOOK_IMAGE / SYLVODE_WEBHOOK_CONFIG override the defaults;
  # scripts/start.sh maps the legacy OPENPR_WEBHOOK_IMAGE / OPENPR_WEBHOOK_CONFIG onto them.
  webhook:
    profiles:
      - connectors
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    image: ${SYLVODE_WEBHOOK_IMAGE:-ghcr.io/openprx/sylvode-webhook:latest}
    volumes:
      - ${SYLVODE_WEBHOOK_CONFIG:-./config/sylvode-webhook.example.toml}:/etc/sylvode-webhook/config.toml:ro
    command: ["/app/sylvode-webhook", "/etc/sylvode-webhook/config.toml"]
    ports:
      - "${SYLVODE_BIND_HOST:-127.0.0.1}:${SYLVODE_WEBHOOK_PORT:-9090}:9090"
    networks:
      - openpr-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  openpr-network:
    driver: bridge
