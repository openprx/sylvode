# cargo-deny configuration — OpenPRX standard v2

[graph]
all-features = true
exclude-dev = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "workspace"
ignore = [
    # Lockfile-only through SQLx's inactive MySQL backend. Sylvode enables only
    # sqlx-postgres at build/runtime; cargo tree -i rsa/sqlx-mysql prints no active tree.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459: SQLx 0.8.6 locks inactive libsqlite3-sys 0.30.1 (<0.31).
    # Patched SQLite starts at 0.39, outside that constraint; no 0.30 patch exists.
    # https://rustsec.org/advisories/RUSTSEC-2026-0459.html
    # No resolved normal/build/dev target or feature may contain SQLite. Every CI
    # audit/deny path runs scripts/verify-inactive-sqlite.sh first and fails if it
    # becomes reachable (even after an upgrade). Remove/review this exception when
    # SQLx resolves a patched dependency or SQLite is deliberately enabled.
    "RUSTSEC-2026-0459",

    # rkyv 0.7 out-of-bounds read when validating an untrusted archive containing Rc/Arc.
    # Reached only as rust_decimal's optional rkyv serialization backend, by way of sea-orm.
    # Sylvode never produces or parses a rkyv archive: decimals cross every boundary as
    # strings (the API rejects JSON numbers for amount fields outright), and no rkyv type
    # appears in the workspace. The fix needs rust_decimal to move to rkyv 0.8, so this
    # cannot be resolved here; revisit when sea-orm ships a rust_decimal with rkyv >=0.8.17.


    # atomic-polyfill is unmaintained. Build-graph-only through wasmtime's Cranelift backend
    # (wasmtime -> cranelift-codegen -> postcard -> heapless -> atomic-polyfill). It exists to
    # emulate atomics on single-core targets; Sylvode builds only for targets with native
    # atomics, so the polyfill paths are never compiled in. Resolvable only when heapless 0.7
    # is dropped upstream.
    "RUSTSEC-2023-0089",

    # Only the Yrs comparison spike uses smallstr; no release binary depends on it.
    "RUSTSEC-2026-0215",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
include-dev = false
include-build = true
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
allow-workspace = true
highlight = "all"

deny = [
    { crate = "openssl", reason = "Use rustls-tls instead", use-instead = "rustls" },
    { crate = "openssl-sys", reason = "Use rustls-tls instead" },
]

[[bans.features]]
crate = "reqwest"
deny = ["native-tls", "native-tls-vendored"]

[bans.workspace-dependencies]
duplicates = "warn"
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
