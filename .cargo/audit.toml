[advisories]
# Lockfile-only through SQLx's inactive MySQL backend; Sylvode enables only
# sqlx-postgres at build/runtime. Verified with cargo tree -i rsa/sqlx-mysql.
ignore = [
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459: SQLx 0.8.6 locks inactive libsqlite3-sys 0.30.1 (<0.31).
    # Patched SQLite starts at 0.39, outside that constraint; no 0.30 patch exists.
    # https://rustsec.org/advisories/RUSTSEC-2026-0459.html
    # No resolved normal/build/dev target or feature may contain SQLite. Every CI
    # audit/deny path runs scripts/verify-inactive-sqlite.sh first and fails if it
    # becomes reachable (even after an upgrade). Remove/review this exception when
    # SQLx resolves a patched dependency or SQLite is deliberately enabled.
    "RUSTSEC-2026-0459",
    # rkyv 0.7 out-of-bounds read when validating an untrusted archive. Reached only as
    # rust_decimal's optional rkyv backend by way of sea-orm; Sylvode never produces or parses
    # a rkyv archive (decimals cross every boundary as strings). Needs rust_decimal on
    # rkyv >=0.8.17 upstream before it can be resolved here.
    "RUSTSEC-2026-0235",
    # atomic-polyfill unmaintained: build-graph-only through wasmtime's Cranelift backend
    # (wasmtime -> cranelift-codegen -> postcard -> heapless). It emulates atomics on
    # single-core targets; Sylvode builds only targets with native atomics, so those paths are
    # never compiled in. Resolvable only when heapless 0.7 is dropped upstream.
    "RUSTSEC-2023-0089",
    # Only the Yrs comparison spike uses smallstr; no release binary depends on it.
    "RUSTSEC-2026-0215",
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
fetch = true
stale = false

[output]
deny = ["unmaintained"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
