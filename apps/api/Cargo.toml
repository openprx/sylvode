[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
ignored = ["jsonwebtoken"]  # used via jwt module, machete false positive

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bcrypt.workspace = true
time.workspace = true
clap.workspace = true
collab-core = { path = "../../crates/collab-core" }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hmac = "0.12"
hex = "0.4"
hashlink = "0.10"
image.workspace = true
jsonwebtoken.workspace = true
parking_lot = "0.12"
platform = { path = "../../crates/platform" }
rand = "0.8"
reqwest.workspace = true
ring.workspace = true
rust_decimal.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
semver.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
# Transport-only legacy Flow v2 adapter invokes the exact existing v1 router.
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
uuid.workspace = true
wasmtime.workspace = true
unicode-casefold.workspace = true
unicode-normalization.workspace = true
zip.workspace = true

[dev-dependencies]
# `tower::ServiceExt::oneshot` — lets the route tests drive a real `axum::Router` with a real
# `http::Request`, so the transport→domain seam (path routing, the `Json` extractor's own
# deserialization, and the handler's field mapping) is actually executed rather than bypassed by
# constructing the request struct in Rust. Already in `Cargo.lock` as a transitive dependency.
wat = "1"
# Parses the runner configuration block the way the runner's own loader does.
toml.workspace = true
tokio-tungstenite = "0.26"
# Builds hostile document bytes (a root container with a reserved name and the wrong type) for the
# package-ingestion tests; the same exact pin as `collab-core`.
loro = "=1.18.0"
# The fixed-rate stand-in for the text measure's CPU reading and the host entry that injects a
# synthetic workload into the debug worker, for the Flow write tests. A dev-dependency only: a build
# of the API (or of the isolated worker) for release does not enable it.
collab-core = { path = "../../crates/collab-core", features = ["test-injection"] }

[lints]
workspace = true
