# Example configuration of sylvode-runner. Every key is described in apps/runner/README.md
# ("Configuration reference"). Every table refuses keys it does not know.
#
# As shipped it listens on loopback, verifies every signature and has no agent, so it runs
# nothing. Start-up is refused until the placeholder secret below is replaced.

[server]
# Loopback only. Put a TLS reverse proxy in front, or listen on another address once the
# secret below is set.
listen = "127.0.0.1:9090"

[security]
# The secret of the Sylvode webhook that delivers to this runner. Start-up is refused while the
# placeholder is in place.
webhook_secrets = ["replace-with-the-secret-of-your-sylvode-runner"]
# Never true in production: without signatures anyone who can reach the port triggers agents.
# On an address other than loopback it is refused unless allow_unsigned_non_loopback = true.
allow_unsigned = false
# Refuse a signed delivery whose timestamp is further than this from now, either way (0 = off).
# Worker AI tasks carry no timestamp; see "Replayed requests" in the README.
max_delivery_age_secs = 300

[features]
# One of the two switches of the tunnel client; see [tunnel] below.
tunnel_enabled = false

[runtime]
# Headless runs of `runner` agents at once; further tasks wait for a slot.
cli_max_concurrency = 1
# Outbound HTTP of the forwarding agents; commands get max(this, 60) seconds.
http_timeout_secs = 15
tunnel_reconnect_backoff_max_secs = 60

# The tunnel client keeps a WebSocket connection to a control plane. It runs only when both
# [features] tunnel_enabled and `enabled` below are true. The values below are placeholders.
[tunnel]
enabled = false
# supports ws:// and wss://, production should use wss://
url = "wss://sylvode.example.com/api/v1/agent-tunnel"
# required: the id the control plane registered for this agent; there is no default
agent_id = "vano-qa"
# sent as Authorization: Bearer <token>
auth_token = "opr_xxx"
# auto reconnect interval after disconnect/failure
reconnect_secs = 3
# heartbeat send interval
heartbeat_secs = 20
# optional: sign outgoing envelopes and verify incoming envelopes; set it to a long random
# secret shared with the control plane (an example placeholder refuses start-up)
# hmac_secret = "replace-with-the-secret-shared-with-the-control-plane"
# if true, inbound tunnel messages without sig are rejected; requires hmac_secret
# (start-up is refused without it)
require_inbound_sig = false

# The bots' tokens for the Sylvode API. A `runner` agent reads and ends its tasks with them. For
# the forwarding agents (webhook, openclaw, openprx, custom) the runner completes a task once the
# hand-over worked and fails it when the hand-over failed, with the token of the task's bot.
# Off by default; safe mode (SYLVODE_RUNNER_SAFE_MODE=1) turns it off too.
[ai_task_callback]
enabled = false
# Base URL of the Sylvode API (no path, query or credentials). Required when enabled. With a
# `runner` agent it must be https:// unless the host is loopback or allow_insecure_transport is set.
api_url = "http://127.0.0.1:8080"
# Acknowledges an http:// api_url to a host other than loopback: bot tokens and every task are sent
# in clear text unless the network itself is encrypted (for example a WireGuard intranet).
# allow_insecure_transport = false
# The opr_ token of the bot that is the tasks' AI participant. A token works ONLY for the tasks
# of the bot that owns it. Required when enabled, here or per bot below.
token = "replace-with-the-bot-token-of-the-ai-participant"
# The id of the bot that owns `token` (its user id in Sylvode). With it, `token` is used only for
# that bot's tasks; without it, for every task no other token covers.
# bot_id = "00000000-0000-0000-0000-000000000000"
# The transport the token is registered with in Sylvode: rest, mcp_http, mcp_sse, mcp_stdio, cli
# or cli_tools_call. Any value but rest is sent as X-Sylvode-MCP-Surface.
surface = "rest"
# Attempts per report, including the first (1 to 10). Transport errors and HTTP 5xx are retried;
# a refusal (for example HTTP 400, the attempt is not active) is not.
max_attempts = 3
# Delay before the first retry in milliseconds, doubled after each further failure (at most
# 60000; the wait between two attempts never exceeds 30 seconds).
retry_delay_ms = 1000

# One entry per further bot this runner serves, keyed by the bot's user id. A task whose bot has
# no token is not reported (and logged); the Sylvode worker then ends it by its timeout.
# [[ai_task_callback.bots]]
# bot_id = "00000000-0000-0000-0000-000000000000"
# token = "replace-with-the-bot-token-of-that-bot"
# surface = "rest"
# webhook_secret = "..."   # verifies this bot's deliveries only

# An openclaw agent sends a chat message for every matching bot task. It runs a local command,
# and safe mode does not stop it, so it is left commented out. Give the agent the bot's user id
# as `id` and its display name as `name`.
#
# [[agents]]
# id = "00000000-0000-0000-0000-000000000000"
# name = "Notify bot"
# agent_type = "openclaw"
# message_template = "[{project}] {event}: {key} {title}\n{actor} | Trigger: {reason}"
#
# [agents.openclaw]
# command = "openclaw"
# args = ["message", "send"] # runs: openclaw message send --channel ... --target ... --message ...
# channel = "signal"
# target = "uuid:00000000-0000-4000-8000-000000000001"

# A webhook agent forwards the delivery, unchanged, to another receiver, which owns the task from
# then on. The runner completes the task once the receiver answers 2xx.
#
# [[agents]]
# id = "00000000-0000-0000-0000-000000000000"
# name = "Review bot"
# agent_type = "webhook"
#
# [agents.webhook]
# url = "https://receiver.example.com/hook"
#
# Optional route constraints: every non-empty list must contain the task's value. Empty lists
# mean "no constraint".
# [agents.route]
# bot_agent_types = ["webhook"]
# Values Sylvode sends: assigned, created, status_changed, mentioned, completed and failed on
# webhook deliveries; assigned, mention, proposal_vote and manual on worker AI tasks. Any other
# value refuses start-up.
# trigger_kinds = ["assigned", "mention"]
# events = ["issue.assigned", "issue.state_changed"]

# A `runner` agent runs a CLI agent for the tasks of a bot connected to a project in Sylvode; the
# connection issues this block. It needs [ai_task_callback] enabled with a token for the bot
# registered for mcp_stdio, and the project working directories must lie below allowed_roots.
#
# [runner]
# allowed_roots = ["~/work"]
# # How long a delivery's answer waits for the session's queue position, in milliseconds. After
# # this the answer is `dispatched` with no position and the task stays queued in arrival order.
# # Default: 250. 0 waits for the session without a bound. At most 60000.
# enqueue_answer_ms = 250
# # The most tasks one session may hold queued; above it the answer is 503 and the delivery
# # retries. Default: 100. 0 means no limit. At most 100000.
# max_queued_per_session = 100
#
# # The one HTTP client the runner uses towards Sylvode (a connection pool per host).
# [runner.http]
# pool_idle_timeout_secs = 60   # 1..=3600; an idle connection is closed after this long
# pool_max_idle_per_host = 8    # at most 1024; 0 means no limit
# tcp_keepalive_secs = 30       # at most 3600; 0 turns keep-alive off
# connect_timeout_secs = 5      # at most 600; 0 means none
#
# [[ai_task_callback.bots]]
# bot_id = "00000000-0000-0000-0000-000000000000"
# workspace_id = "00000000-0000-0000-0000-000000000000"  # the workspace the bot belongs to
# token = "replace-with-the-bot-token"
# surface = "mcp_stdio"
#
# [[agents]]
# id = "00000000-0000-0000-0000-000000000000"
# name = "Build bot"
# agent_type = "runner"
# [agents.route]
# bot_ids = ["00000000-0000-0000-0000-000000000000"]

# To type the tasks of one bot, from every project it is connected to, into tmux sessions that
# already exist (your own lead session, say), name them here. The runner never creates, renames or
# restarts them; when one is absent it is not used, and a task for a bot with no usable session
# fails and can be retried. bot is the bot's id (a lower case, hyphenated UUID) and must be one of
# the bot_ids of a runner agent that has a token under [[ai_task_callback.bots]]; cli is claude or
# codex; names holds 1 to 8 session names, each matching ^[A-Za-z0-9_][A-Za-z0-9_-]{0,63}$ and not
# looking like <KEY>-claude or <KEY>-codex, and no name is used twice on this runner (compared
# without case). The first name is the primary. With more than one name the bot works on several
# tasks at once, one per session: the runner picks the member for each task (the same task
# again, then the same work item, then an idle member, then the shortest queue). A task of such a
# bot over the tmux channel goes into a member session (a headless connection runs headless as
# configured), and its working directory is neither checked nor used. Every member needs its own
# Sylvode MCP entry for the bot (see `sylvode-runner setup claude`). Tasks of one bot can then run
# and finish out of order across members. The old `name` key is gone; write `names = ["sv"]`.
#
# [[runner.tmux.sessions]]
# bot = "00000000-0000-0000-0000-000000000000"
# cli = "claude"
# names = ["sv", "sv-2", "sv-3"]
#
# How the members of a bot's session pool are chosen and watched. The defaults suit most runners.
# [runner.tmux.pool]
# affinity_ttl_secs = 3600     # 1..=604800; a work item sticks to the member that last served it
# stuck_after_secs = 300       # 10..=86400; a member blocked on a dialog or held by its screen this
#                              # long, or one that was declined at a delivery, is unhealthy
# rebalance_after_secs = 120   # 1..=86400; queued tasks never typed in leave a member that has
#                              # been unhealthy this long
