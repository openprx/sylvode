[package]
name = "sylvode-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sylvode runner: receives Sylvode task deliveries and runs agents"
repository.workspace = true

[lib]
name = "sylvode_runner"
path = "src/lib.rs"

[[bin]]
name = "sylvode-runner"
path = "src/bin/sylvode-runner.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
tower-http.workspace = true
futures-util = "0.3"
# The same major version axum's `ws` feature already resolves in this workspace.
tokio-tungstenite = "0.29"
uuid.workspace = true
# NFC normalisation of titles put into a CLI session.
unicode-normalization.workspace = true
# General categories (format, private-use and unassigned characters) for the title sanitiser and the
# paste guard.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# Concurrency-safe locks (std's Mutex is disallowed in this workspace).
parking_lot.workspace = true
# Parses listen addresses and tunnel URLs to compare their host exactly (already used by reqwest).
url = "2"
# CancellationToken and TaskTracker: stop running executors on shutdown and wait for their
# terminal callbacks.
tokio-util = { workspace = true, features = ["rt"] }

# Signals a whole process group (killpg) through a safe API; the crate forbids `unsafe`.
# The same version zip already resolves in this workspace.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "fs", "dir"] }

[lints]
workspace = true
