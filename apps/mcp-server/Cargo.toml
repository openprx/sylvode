[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mcp_server"
path = "src/lib.rs"

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[[bin]]
name = "list-tools"
path = "src/bin/list-tools.rs"

[[bin]]
name = "sylvode"
path = "src/bin/sylvode.rs"

[[bin]]
name = "sylvode-skillgen"
path = "src/bin/skillgen.rs"

[dependencies]
anyhow.workspace = true
api = { path = "../api" }
axum.workspace = true
base64 = "0.22"
clap.workspace = true
parking_lot = "0.12"
platform = { path = "../../crates/platform" }
rand = "0.8"
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sylvode-prereq = { path = "../../crates/sylvode-prereq", features = ["http"] }
tokio.workspace = true
tokio-stream = "0.1"
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
collab-core = { path = "../../crates/collab-core" }
hex = "0.4"
sea-orm.workspace = true
serde_jcs.workspace = true
tracing-subscriber.workspace = true

# The end-to-end test that starts the shipped server from the files and argument vectors the
# runner itself produces (`tests/runner_launch_e2e.rs`); the runner is Unix only.
[target.'cfg(unix)'.dev-dependencies]
sylvode-runner = { path = "../runner", features = ["test-support"] }
toml.workspace = true

[lints]
workspace = true
