# Interop harness for the MCP server: drives a running `mcp-server` over stdio or HTTP with the
# official Rust SDK types (`rmcp`) and with raw JSON-RPC for the negative cases. It is excluded from
# the workspace (root `Cargo.toml`, `exclude`) so that `rmcp` and its HTTP stack never enter the
# workspace lock file. Build: `cargo build --manifest-path apps/mcp-server/interop/Cargo.toml`.

[package]
name = "sylvode-mcp-interop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mcp-interop"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.11.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
