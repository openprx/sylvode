[workspace]
exclude = ["crates/vendor/sea-orm", "apps/mcp-server/interop"]
resolver = "2"
members = [
  "apps/api",
  "apps/worker",
  "apps/mcp-server",
  "apps/runner",
  "crates/platform",
  "crates/collab-core",
  "crates/sylvode-prereq",
  "crates/sv-rules",
  "crates/sv-layout",
  "crates/sv-package",
  "spikes/collab-shared",
  "spikes/collab-loro",
  "spikes/collab-yrs-yjs",
  "benches/flow-loro",
]

[workspace.package]
authors = ["g1e2x87"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.5.0"
description = "Sylvode open-source project management platform"
repository = "https://github.com/openprx/sylvode"
homepage = "https://openprx.dev/sylvode"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws", "multipart"] }
time = { version = "0.3", features = ["formatting", "large-dates", "macros", "parsing", "serde", "serde-well-known"] }
clap = { version = "4.5.38", features = ["derive"] }
# SMTP protocol library for notification e-mails. Only the message builder is linked into crates
# that build messages; the worker adds the transport with rustls (ring) and the bundled web roots.
lettre = { version = "0.11", default-features = false }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "rustls-tls-native-roots", "stream"], default-features = false }
sea-orm = { version = "1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-json",
  "with-time",
  "with-uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
base64 = "0.22"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower = "0.5.2"
tower-http = { version = "0.6.4", features = ["trace", "cors", "compression-gzip", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.4", features = ["v4", "v5", "serde"] }
jsonwebtoken = "9"
ring = "0.17"
parking_lot = "0.12"
bcrypt = "0.16"
# The on-disk compilation cache is unused: the plugin engine never loads a cache
# config and compiles every module from its stored `.wasm` bytes. Leaving the
# feature off keeps wasmtime-internal-cache and its zstd 0.13 / zstd-safe /
# zstd-sys chain out of the build. That chain is no longer the reason: with the
# cache on, wasmtime 50.0.2 resolves zstd 0.13.5, zstd-safe 7.4 and zstd-sys
# 2.1.3, which are patched for RUSTSEC-2026-0391, RUSTSEC-2026-0398,
# RUSTSEC-2026-0403 and RUSTSEC-2026-0410.
# Every other wasmtime 50 default feature stays on.
wasmtime = { version = "50.0.2", default-features = false, features = [
    "anyhow",
    "async",
    "backtrace",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "component-model-async",
    "threads",
    "stack-switching",
    "std",
    "debug",
    "compile-time-builtins",
    "wit-parser",
] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde_jcs = "0.2"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
zip = { version = "9.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

inefficient_to_string = "deny"
large_futures = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"
too_many_lines = "allow"

# The isolated-apply worker enforces `decode_apply_cpu_ms_max`, a budget calibrated
# against production release builds. The whole metered window runs inside
# collab-core (decode, apply, semantic snapshot, shape validation), so an
# unoptimized build of this one crate makes a legitimate document exceed a
# production budget: at opt-level 0 the ceiling fires around 3,000 nodes, while
# release measures ~14ms for the full 10,000-node structural boundary. Optimize
# collab-core even in dev profiles so the metered work runs at production speed
# and the rest of the workspace stays debuggable.
[profile.dev.package.collab-core]
opt-level = 3

# Same reason, one level down: most of the metered window's real work happens
# inside Loro itself, so optimizing only collab-core moves the ceiling from
# ~3,000 to ~4,000 nodes and still rejects a legitimate 10,000-node document.
[profile.dev.package.loro]
opt-level = 3
[profile.dev.package.loro-internal]
opt-level = 3
[profile.dev.package.loro-common]
opt-level = 3
[profile.dev.package.loro-delta]
opt-level = 3
[profile.dev.package.loro-rle]
opt-level = 3
[profile.dev.package.loro-kv-store]
opt-level = 3
[profile.dev.package.loro_fractional_index]
opt-level = 3
[profile.dev.package.loro-thunderdome]
opt-level = 3

# Preserve SeaORM JSON decoding with its unused Chrono edge removed from the lockfile.
[patch.crates-io]
sea-orm = { path = "crates/vendor/sea-orm" }
