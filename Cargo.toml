[package]
name = "sylvode-webhook"
version = "0.3.44"
edition = "2024"
authors = ["g1e2x87"]
license = "MIT OR Apache-2.0"
description = "Webhook receiver and agent dispatcher for Sylvode (formerly OpenPR Webhook)"
repository = "https://github.com/openprx/openpr-webhook"

[lib]
name = "sylvode_webhook"
path = "src/lib.rs"

# One library entry point, two executables: the canonical name and the legacy name kept for Sylvode 1.x.
[[bin]]
name = "sylvode-webhook"
path = "src/bin/sylvode-webhook.rs"

[[bin]]
name = "openpr-webhook"
path = "src/bin/openpr-webhook.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4", "serde"] }
# Parses listen addresses and tunnel URLs to compare their host exactly (already used by reqwest).
url = "2"
# CancellationToken and TaskTracker: stop running executors on shutdown and wait for their
# terminal callbacks.
tokio-util = { version = "0.7", features = ["rt"] }

# Signals a whole process group (killpg) through a safe API; the crate forbids `unsafe`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
# Zero warnings and zero dead code are rules, not preferences: every warning, from rustc or clippy,
# fails `cargo check` and `cargo clippy` without needing `-D warnings` on the command line.
warnings = { level = "deny", priority = -2 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# clippy.toml lists std::sync::Mutex / RwLock as disallowed; these make that a hard error.
disallowed_types = "deny"
disallowed_methods = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

inefficient_to_string = "deny"
large_futures = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"
too_many_lines = "allow"
