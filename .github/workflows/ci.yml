name: CI

on:
  # Every branch. Tags stay on the Release workflow, so a release tag does not also run CI.
  push:
    branches:
      - "**"
  # Any base branch, so a pull request is tested before it is retargeted onto main.
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check with all features
        run: cargo check --workspace --all-features

      - name: Unused deps
        env:
          RUSTFLAGS: ""
        run: |
          # 0.10.1 requires Path::is_empty, unavailable on the pinned Rust 1.97 toolchain.
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete

      - name: SQLite exception guard controls
        run: bash scripts/test-verify-inactive-sqlite.sh

      - name: Start script configuration checks
        run: bash scripts/test-start-config.sh

      - name: Demo bootstrap input checks
        run: bash scripts/test-bootstrap-demo-env.sh

      - name: No machine-specific paths in scripts
        run: bash scripts/test-no-machine-paths.sh

      - name: No private addresses or bot token literals
        run: bash scripts/test-no-instance-literals.sh

      - name: Web E2E stack script preflight
        run: bash scripts/test-e2e-web-stack.sh

      - name: nginx event stream location
        run: bash scripts/test-nginx-event-stream-location.sh

      - name: nginx OAuth locations and headers
        run: bash scripts/test-nginx-oauth-locations.sh

      # Single-repository form only: the sibling repositories are not checked out here. The
      # five-repository release form runs locally (see scripts/verify-sylvode-brand-residue.sh --help).
      - name: Brand residue gate (this repository)
        run: |
          bash scripts/verify-sylvode-brand-residue.sh --json --strict >/dev/null
          bash scripts/verify-sylvode-brand-residue.sh --json --self-test >/dev/null

  # A fast signal for the runner (apps/runner): fmt, clippy and its tests on Linux and
  # macOS, without waiting for the workspace-wide jobs. It runs when the push or pull request
  # changes apps/runner or what it builds with; a push whose base is unknown (a new branch) runs
  # it as well. The workspace-wide Lint and Test jobs still cover the receiver on every run.
  runner-changes:
    name: Runner changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Compare with the base
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          [ "$EVENT_NAME" = "push" ] && base="$PUSH_BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$base" HEAD -- apps/runner config/sylvode-runner.example.toml \
              Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/ci.yml | grep -q .; then
            changed=true
          else
            changed=false
          fi
          echo "runner=$changed" >>"$GITHUB_OUTPUT"

  # The skill (`skills/sylvode-mcp`) is the single hand-written source for what an agent is told
  # about the MCP server; every tool list and count elsewhere is generated from the tool
  # catalogue. This job fails when the MCP server, the catalogue, the skill or a generated block
  # changed and the generated files were not regenerated (fix: cargo run -p mcp-server --bin
  # sylvode-skillgen -- --write). It runs when one of the inputs changed, and on a push whose base
  # is unknown.
  skills-sync:
    name: Skills sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Compare with the base
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          [ "$EVENT_NAME" = "push" ] && base="$PUSH_BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$base" HEAD -- apps/mcp-server skills apps/api/src/routes/context.rs \
              apps/api/tests/fixtures README.md docs/README.md apps/runner/src/runner/guide.rs crates/platform Cargo.lock .github/workflows/ci.yml | grep -q .; then
            changed=true
          else
            changed=false
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: steps.filter.outputs.changed == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.filter.outputs.changed == 'true'
        with:
          key: skills-sync
      - name: Generated files are current
        if: steps.filter.outputs.changed == 'true'
        run: cargo run --locked -p mcp-server --bin sylvode-skillgen -- --check
      - name: Skill text and catalogue lint
        if: steps.filter.outputs.changed == 'true'
        run: cargo run --locked -p mcp-server --bin sylvode-skillgen -- --lint
      - name: Catalogue tests
        if: steps.filter.outputs.changed == 'true'
        run: cargo test --locked -p mcp-server --lib "catalog::"
      - name: Agent policy names are catalogue names
        if: steps.filter.outputs.changed == 'true'
        run: cargo test --locked -p api --lib routes::context

  runner:
    name: Runner (${{ matrix.os }})
    needs: runner-changes
    if: needs.runner-changes.outputs.runner == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: runner
      - name: Format check
        run: cargo fmt -p sylvode-runner -- --check
      - name: Clippy
        run: cargo clippy -p sylvode-runner --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test -p sylvode-runner --all-features

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sylvode_ci
          POSTGRES_PASSWORD: sylvode_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylvode_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Maintenance connection: DB-backed tests create and drop their own scratch
      # databases next to this one (CREATE/DROP DATABASE ... WITH (FORCE)) and apply
      # migrations/*.sql, which need CREATE EXTENSION pgcrypto. The superuser created
      # by the image holds both privileges. Keep the path a bare database name: the
      # tests swap the last path segment for the scratch database name.
      OPENPR_TEST_DATABASE_URL: postgres://sylvode_ci:sylvode_ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build isolated apply worker
        # apps/api collab tests spawn this binary from target/debug and fail when it is absent.
        run: cargo build -p collab-core --bin collab-isolated-apply-worker
      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check
        working-directory: frontend
        run: bun run check
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Unit and contract tests
        working-directory: frontend
        run: |
          set -e
          for suite in record-values markdown-sanitize flow-limits flow-scope-api flow-route-scope flow-navigator-placements flow-i18n-parity i18n-parity bot-transport-surfaces \
                       webhook-events flow-navigator-equivalence flow-cross-parent-move flow-ui-state flow-bridge flow-dangling-parent \
                       flow-package-import flow-v0.4 flow-static-build flow-outbox flow-offline-recovery flow-apply-busy \
                       shell-routing shell-state shell-keyboard surface-host project-nav shell-redirects surface-embed \
                       component-adapters toast-routing workbench-tabs forms-page forms-csv-export plugin-creator-review-focus oauth workspace-role sprint-rules workflow-state due-date \
                       agent-tasks connection-managed connection-section connection-list uuid flow-handshake-failure; do
            echo "::group::test:$suite"
            bun run "test:$suite"
            echo "::endgroup::"
          done
      - name: Build
        working-directory: frontend
        run: bun run build

  universal-forms:
    name: Universal Forms Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sylvode_ci
          POSTGRES_PASSWORD: sylvode_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylvode_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Maintenance connection: DB-backed tests create and drop their own scratch
      # databases next to this one (CREATE/DROP DATABASE ... WITH (FORCE)) and apply
      # migrations/*.sql, which need CREATE EXTENSION pgcrypto. The superuser created
      # by the image holds both privileges. Keep the path a bare database name: the
      # tests swap the last path segment for the scratch database name.
      OPENPR_TEST_DATABASE_URL: postgres://sylvode_ci:sylvode_ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install audit tools
        env:
          RUSTFLAGS: ""
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
          cargo install cargo-audit --locked

      - name: Universal forms CI gates
        run: bash scripts/ci-universal-forms-gates.sh

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release
        run: cargo build --workspace --release
      # The Web E2E and Image contents jobs reuse these binaries instead of building again.
      - name: Upload release binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries
          path: |
            target/release/api
            target/release/worker
            target/release/collab-isolated-apply-worker
          if-no-files-found: error
          retention-days: 3

  # The Release workflow builds every workspace binary for Windows, and nothing else compiled that
  # target before a tag: a Unix-only call then failed the release. Compiles the same package set
  # for the same target, with the warnings policy of the release build.
  windows-build:
    name: Windows build
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-pc-windows-msvc
      - name: Check every workspace binary for Windows
        run: cargo check --locked --target x86_64-pc-windows-msvc

  # Browser E2E against a real stack: release API + PostgreSQL + the built frontend behind a
  # same-origin proxy and the background worker, started by the same script used locally
  # (scripts/e2e-web-stack.sh). The specs it runs are listed (with the exclusions) in the run step.
  web-e2e:
    name: Web E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sylvode_ci
          POSTGRES_PASSWORD: sylvode_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylvode_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Maintenance connection: the stack script creates and drops its own scratch database next
      # to this one.
      OPENPR_TEST_DATABASE_URL: postgres://sylvode_ci:sylvode_ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/api target/release/worker target/release/collab-isolated-apply-worker
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          echo "CHROMIUM_BIN=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Install psql
        # flow-convert.spec.ts writes its retry fixture with psql.
        run: command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
      - name: Start stack
        id: stack
        run: |
          echo "E2E_STACK_DIR=$RUNNER_TEMP/e2e-web-stack" >> "$GITHUB_ENV"
          E2E_STACK_DIR="$RUNNER_TEMP/e2e-web-stack" bash scripts/e2e-web-stack.sh up
      - name: Run Web E2E specs
        env:
          # The retry test fails instead of skipping when E2E_DATABASE_URL is missing.
          E2E_REQUIRE_DATABASE: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: |
          # Every Flow spec (the glob picks up new flow-*.spec.ts files) plus the workspace home.
          # Not run here: universal-forms-*.spec.ts need the demo seed accounts and fixed UUIDs,
          # bot-transport-surface.spec.ts and webhook-events.spec.ts need TEST_EMAIL/TEST_PASSWORD
          # of an existing account (without them they self-register, which this stack refuses
          # because its instance admin is already the first account).
          npx playwright test \
            tests/e2e/web/flow-*.spec.ts \
            tests/e2e/web/workspace-home.spec.ts \
            --reporter=list,json
      - name: Report counts and skipped tests
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          results=test-results/results.json
          test -f "$results" || { echo "::error::$results was not written"; exit 1; }
          jq -r '.stats | "expected=\(.expected) unexpected=\(.unexpected) flaky=\(.flaky) skipped=\(.skipped)"' "$results"
          jq -r '.suites | .. | objects | select(has("specs")) | .specs[] | . as $spec | .tests[]
                 | select(.status == "skipped") | "SKIPPED: \($spec.file):\($spec.line) \($spec.title)"' "$results"
          jq -r '.suites | .. | objects | select(has("specs")) | .specs[] | . as $spec | .tests[]
                 | select(.status == "flaky") | "FLAKY: \($spec.file):\($spec.line) \($spec.title)"' "$results"
          skipped=$(jq '.stats.skipped' "$results")
          expected=$(jq '.stats.expected' "$results")
          flaky=$(jq '.stats.flaky' "$results")
          if [ "$skipped" -ne 0 ]; then echo "::error::$skipped Web E2E test(s) skipped"; exit 1; fi
          # Retries stay on (playwright.config.ts) so a failure leaves a trace, but a test that
          # only passed on a retry is a failure here, not a pass.
          if [ "$flaky" -ne 0 ]; then echo "::error::$flaky Web E2E test(s) flaky (passed only on retry)"; exit 1; fi
          if [ "$expected" -eq 0 ]; then echo "::error::no Web E2E test passed"; exit 1; fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-failure
          path: |
            test-results/
            ${{ env.E2E_STACK_DIR }}/api.log
            ${{ env.E2E_STACK_DIR }}/worker.log
            ${{ env.E2E_STACK_DIR }}/proxy.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop stack
        if: always()
        run: bash scripts/e2e-web-stack.sh down

  # Builds the api and worker images from Dockerfile.prebuilt with the Build job's binaries and
  # checks what each ships: the api image must carry collab-isolated-apply-worker next to the API
  # (without it every Flow collaborative write is refused), the worker image must not.
  image-contents:
    name: Image contents
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/api target/release/worker target/release/collab-isolated-apply-worker
      - name: Build images and check their contents
        run: bash scripts/verify-prebuilt-images.sh
