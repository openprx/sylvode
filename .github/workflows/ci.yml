name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check with all features
        run: cargo check --workspace --all-features

      - name: Unused deps
        env:
          RUSTFLAGS: ""
        run: |
          cargo install cargo-machete --locked
          cargo machete

      - name: Start script configuration checks
        run: bash scripts/test-start-config.sh

      - name: Demo bootstrap input checks
        run: bash scripts/test-bootstrap-demo-env.sh

      - name: No machine-specific paths in scripts
        run: bash scripts/test-no-machine-paths.sh

      - name: No private addresses or bot token literals
        run: bash scripts/test-no-instance-literals.sh

      - name: Web E2E stack script preflight
        run: bash scripts/test-e2e-web-stack.sh

      # Single-repository form only: the sibling repositories are not checked out here. The
      # five-repository release form runs locally (see CONTRIBUTING, "Brand residue gate").
      - name: Brand residue gate (this repository)
        run: |
          bash scripts/verify-sylvode-brand-residue.sh --json --strict >/dev/null
          bash scripts/verify-sylvode-brand-residue.sh --json --self-test >/dev/null

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sylvode_ci
          POSTGRES_PASSWORD: sylvode_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylvode_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Maintenance connection: DB-backed tests create and drop their own scratch
      # databases next to this one (CREATE/DROP DATABASE ... WITH (FORCE)) and apply
      # migrations/*.sql, which need CREATE EXTENSION pgcrypto. The superuser created
      # by the image holds both privileges. Keep the path a bare database name: the
      # tests swap the last path segment for the scratch database name.
      OPENPR_TEST_DATABASE_URL: postgres://sylvode_ci:sylvode_ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build isolated apply worker
        # apps/api collab tests spawn this binary from target/debug and fail when it is absent.
        run: cargo build -p collab-core --bin collab-isolated-apply-worker
      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check
        working-directory: frontend
        run: bun run check
      - name: Unit and contract tests
        working-directory: frontend
        run: |
          set -e
          for suite in record-values flow-limits flow-i18n-parity i18n-parity bot-transport-surfaces \
                       webhook-events flow-navigator-equivalence flow-ui-state flow-bridge \
                       flow-package-import flow-v0.4 flow-static-build; do
            echo "::group::test:$suite"
            bun run "test:$suite"
            echo "::endgroup::"
          done
      - name: Build
        working-directory: frontend
        run: bun run build

  universal-forms:
    name: Universal Forms Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sylvode_ci
          POSTGRES_PASSWORD: sylvode_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylvode_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Maintenance connection: DB-backed tests create and drop their own scratch
      # databases next to this one (CREATE/DROP DATABASE ... WITH (FORCE)) and apply
      # migrations/*.sql, which need CREATE EXTENSION pgcrypto. The superuser created
      # by the image holds both privileges. Keep the path a bare database name: the
      # tests swap the last path segment for the scratch database name.
      OPENPR_TEST_DATABASE_URL: postgres://sylvode_ci:sylvode_ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install audit tools
        env:
          RUSTFLAGS: ""
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
          cargo install cargo-audit --locked

      - name: Universal forms CI gates
        run: bash scripts/ci-universal-forms-gates.sh

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release
        run: cargo build --workspace --release
      # The Web E2E and Image contents jobs reuse these binaries instead of building again.
      - name: Upload release binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries
          path: |
            target/release/api
            target/release/worker
            target/release/collab-isolated-apply-worker
          if-no-files-found: error
          retention-days: 3

  # Browser E2E against a real stack: release API + PostgreSQL + the built frontend behind a
  # same-origin proxy, started by the same script used locally (scripts/e2e-web-stack.sh). The
  # universal-forms specs are not run here: they need the demo seed accounts and fixed UUIDs.
  web-e2e:
    name: Web E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sylvode_ci
          POSTGRES_PASSWORD: sylvode_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylvode_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Maintenance connection: the stack script creates and drops its own scratch database next
      # to this one.
      OPENPR_TEST_DATABASE_URL: postgres://sylvode_ci:sylvode_ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/api target/release/worker target/release/collab-isolated-apply-worker
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          echo "CHROMIUM_BIN=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Install psql
        # flow-convert.spec.ts writes its retry fixture with psql.
        run: command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
      - name: Start stack
        id: stack
        run: |
          echo "E2E_STACK_DIR=$RUNNER_TEMP/e2e-web-stack" >> "$GITHUB_ENV"
          E2E_STACK_DIR="$RUNNER_TEMP/e2e-web-stack" bash scripts/e2e-web-stack.sh up
      - name: Run Web E2E specs
        env:
          # The retry test fails instead of skipping when E2E_DATABASE_URL is missing.
          E2E_REQUIRE_DATABASE: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: |
          npx playwright test \
            tests/e2e/web/flow-settings.spec.ts \
            tests/e2e/web/flow-package-roundtrip.spec.ts \
            tests/e2e/web/flow-operations.spec.ts \
            tests/e2e/web/flow-convert.spec.ts \
            tests/e2e/web/workspace-home.spec.ts \
            --reporter=list,json
      - name: Report counts and skipped tests
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          results=test-results/results.json
          test -f "$results" || { echo "::error::$results was not written"; exit 1; }
          jq -r '.stats | "expected=\(.expected) unexpected=\(.unexpected) flaky=\(.flaky) skipped=\(.skipped)"' "$results"
          jq -r '.suites | .. | objects | select(has("specs")) | .specs[] | . as $spec | .tests[]
                 | select(.status == "skipped") | "SKIPPED: \($spec.file):\($spec.line) \($spec.title)"' "$results"
          skipped=$(jq '.stats.skipped' "$results")
          expected=$(jq '.stats.expected' "$results")
          if [ "$skipped" -ne 0 ]; then echo "::error::$skipped Web E2E test(s) skipped"; exit 1; fi
          if [ "$expected" -eq 0 ]; then echo "::error::no Web E2E test passed"; exit 1; fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-failure
          path: |
            test-results/
            ${{ env.E2E_STACK_DIR }}/api.log
            ${{ env.E2E_STACK_DIR }}/proxy.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop stack
        if: always()
        run: bash scripts/e2e-web-stack.sh down

  # Builds the api and worker images from Dockerfile.prebuilt with the Build job's binaries and
  # checks what each ships: the api image must carry collab-isolated-apply-worker next to the API
  # (without it every Flow collaborative write is refused), the worker image must not.
  image-contents:
    name: Image contents
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/api target/release/worker target/release/collab-isolated-apply-worker
      - name: Build images and check their contents
        run: bash scripts/verify-prebuilt-images.sh
