name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unused deps
        env:
          RUSTFLAGS: ""
        run: |
          cargo install cargo-machete --locked
          cargo machete

      - name: Start script configuration checks
        run: bash scripts/test-start-config.sh

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openpr_ci
          POSTGRES_PASSWORD: openpr_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpr_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Maintenance connection: DB-backed tests create and drop their own scratch
      # databases next to this one (CREATE/DROP DATABASE ... WITH (FORCE)) and apply
      # migrations/*.sql, which need CREATE EXTENSION pgcrypto. The superuser created
      # by the image holds both privileges. Keep the path a bare database name: the
      # tests swap the last path segment for the scratch database name.
      OPENPR_TEST_DATABASE_URL: postgres://openpr_ci:openpr_ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build isolated apply worker
        # apps/api collab tests spawn this binary from target/debug and fail when it is absent.
        run: cargo build -p collab-core --bin collab-isolated-apply-worker
      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check
        working-directory: frontend
        run: bun run check
      - name: Build
        working-directory: frontend
        run: bun run build

  universal-forms:
    name: Universal Forms Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openpr_ci
          POSTGRES_PASSWORD: openpr_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpr_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Maintenance connection: DB-backed tests create and drop their own scratch
      # databases next to this one (CREATE/DROP DATABASE ... WITH (FORCE)) and apply
      # migrations/*.sql, which need CREATE EXTENSION pgcrypto. The superuser created
      # by the image holds both privileges. Keep the path a bare database name: the
      # tests swap the last path segment for the scratch database name.
      OPENPR_TEST_DATABASE_URL: postgres://openpr_ci:openpr_ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install audit tools
        env:
          RUSTFLAGS: ""
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
          cargo install cargo-audit --locked

      - name: Universal forms CI gates
        run: bash scripts/ci-universal-forms-gates.sh

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --workspace --release
