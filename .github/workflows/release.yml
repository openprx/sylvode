name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

# Least privilege: every job reads only, except the two that publish (packages, release).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Canonical name. Every archive also ships the legacy openpr-webhook executable, and each
  # archive is published a second time under the legacy openpr-webhook-<suffix> name (same bytes,
  # own sha256) for the whole Sylvode 1.x line.
  BINARY_NAME: sylvode-webhook
  LEGACY_BINARY_NAME: openpr-webhook

jobs:
  prepare:
    # The tag comes from the pushed ref or from the dispatch input. It is validated here, once,
    # and every later job uses only this output; untrusted input never reaches a shell directly.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine and validate the tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          # [[ =~ ]] anchors to the whole string, so a value with a newline cannot pass.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "The release tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

  build:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --tag v0.2.5

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          cd "target/$TARGET/release"
          chmod +x "$BINARY_NAME" "$LEGACY_BINARY_NAME"
          tar czf "../../../$BINARY_NAME-$SUFFIX.tar.gz" "$BINARY_NAME" "$LEGACY_BINARY_NAME"
          cd ../../..
          cp "$BINARY_NAME-$SUFFIX.tar.gz" "$LEGACY_BINARY_NAME-$SUFFIX.tar.gz"
          # shasum is present on both the Linux and the macOS runners.
          shasum -a 256 "$BINARY_NAME-$SUFFIX.tar.gz" > "$BINARY_NAME-$SUFFIX.tar.gz.sha256"
          shasum -a 256 "$LEGACY_BINARY_NAME-$SUFFIX.tar.gz" > "$LEGACY_BINARY_NAME-$SUFFIX.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sylvode-webhook-${{ matrix.suffix }}
          path: |
            sylvode-webhook-${{ matrix.suffix }}.tar.gz
            sylvode-webhook-${{ matrix.suffix }}.tar.gz.sha256
            openpr-webhook-${{ matrix.suffix }}.tar.gz
            openpr-webhook-${{ matrix.suffix }}.tar.gz.sha256
          if-no-files-found: error

  image:
    # Builds the container image once and pushes the same manifest under both names, so
    # ghcr.io/openprx/sylvode-webhook and the legacy ghcr.io/openprx/openpr-webhook share a digest.
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/openprx/sylvode-webhook
            ghcr.io/openprx/openpr-webhook
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify both names resolve to one digest
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          canonical=$(docker buildx imagetools inspect "ghcr.io/openprx/sylvode-webhook:$version" --format '{{.Manifest.Digest}}')
          legacy=$(docker buildx imagetools inspect "ghcr.io/openprx/openpr-webhook:$version" --format '{{.Manifest.Digest}}')
          echo "sylvode-webhook:$version -> $canonical"
          echo "openpr-webhook:$version -> $legacy"
          test "$canonical" = "$legacy"
          test "$canonical" = "$DIGEST"

  release:
    # Published only when every archive and the image were built: a failed or skipped dependency
    # must not produce a release with missing assets.
    needs: [prepare, build, image]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      needs.image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check that every archive is present
        shell: bash
        run: |
          set -euo pipefail
          for name in sylvode-webhook openpr-webhook; do
            for suffix in linux-amd64 linux-arm64 macos-amd64 macos-arm64; do
              test -s "artifacts/$name-$suffix.tar.gz"
              test -s "artifacts/$name-$suffix.tar.gz.sha256"
            done
          done

      - name: Create or Update Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Sylvode Webhook ${{ needs.prepare.outputs.tag }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            ## Sylvode Webhook ${{ needs.prepare.outputs.tag }}

            Webhook receiver and agent dispatcher for Sylvode (formerly OpenPR Webhook).

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `sylvode-webhook-linux-amd64.tar.gz` |
            | Linux | ARM64 | `sylvode-webhook-linux-arm64.tar.gz` |
            | macOS | Intel | `sylvode-webhook-macos-amd64.tar.gz` |
            | macOS | Apple Silicon | `sylvode-webhook-macos-arm64.tar.gz` |

            Each archive contains the `sylvode-webhook` executable and the legacy `openpr-webhook`
            executable, which runs the same program and prints a deprecation notice. Matching
            `openpr-webhook-<platform>.tar.gz` archives with the same contents are retained as
            aliases, each with its own `.sha256`. The legacy names are not removed before Sylvode v2.0.

            Container image: `ghcr.io/openprx/sylvode-webhook` (tags `<version>`, `<major>.<minor>`
            and `latest`, without the leading `v`), also published as the legacy
            `ghcr.io/openprx/openpr-webhook` with the same digest.

            Read the upgrade notes in CHANGELOG.md before upgrading: some configurations that
            started before are refused now.
