name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

# Read-only by default; only the release job writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed tag, or the input of a manual run. Passed to scripts
  # through the environment, never interpolated into them.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Fails before anything is built when the tag is not exactly v<workspace version>, so a release
  # can only carry the version its Cargo.toml and frontend/package.json declare.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Tag equals the workspace and frontend versions
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$RELEASE_TAG' is not v<major>.<minor>.<patch>"
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          frontend_version="$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')"
          echo "tag=$tag_version Cargo.toml=$cargo_version frontend/package.json=$frontend_version"
          if ! [[ "$tag_version" == "$cargo_version" && "$tag_version" == "$frontend_version" ]]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo.toml ($cargo_version) and frontend/package.json ($frontend_version)"
            exit 1
          fi
          grep -q '^## \[Unreleased\]\|^## \['"$tag_version"'\]' CHANGELOG.md || {
            echo "::error::CHANGELOG.md has neither an [Unreleased] nor a [$tag_version] section"
            exit 1
          }

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-amd64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: cli-windows-amd64
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      # The action adds the target to the stable toolchain, but rust-toolchain.toml
      # pins the channel, so cargo builds with a toolchain that action never touched.
      # Only a non-host native target notices: the host one ships with every toolchain.
      - name: Add target to the pinned toolchain
        if: "!matrix.use_cross"
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Install system deps (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build all binaries (cross)
        if: matrix.use_cross
        run: |
          cross build --release -p api --bin api --target ${{ matrix.target }}
          # The API spawns this for every Flow collaborative write and looks for it next to its
          # own executable, so it ships in the same archive directory as api.
          cross build --release -p collab-core --bin collab-isolated-apply-worker --target ${{ matrix.target }}
          cross build --release -p worker --bin worker --target ${{ matrix.target }}
          cross build --release -p mcp-server --bin mcp-server --target ${{ matrix.target }}
          cross build --release -p mcp-server --bin sylvode --target ${{ matrix.target }}
          # The runner ships in its own archive on the Unix targets (it is Unix-only).
          cross build --release -p sylvode-runner --bins --target ${{ matrix.target }}

      # Builds every workspace binary, collab-isolated-apply-worker included.
      - name: Build all binaries (native)
        if: "!matrix.use_cross && runner.os != 'Windows'"
        run: cargo build --release --target ${{ matrix.target }}

      # Windows ships only the client tools (the CLI and the stdio MCP server): the server
      # binaries are Linux-only in practice (Flow collaborative writes need Linux).
      - name: Build the client tools (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }} -p mcp-server --bin mcp-server --bin sylvode

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          # collab-isolated-apply-worker must stay in the same directory as api.
          for bin in api collab-isolated-apply-worker worker mcp-server sylvode; do
            test -x target/${{ matrix.target }}/release/$bin
            cp target/${{ matrix.target }}/release/$bin staging/
            chmod +x staging/$bin
          done
          cd staging
          tar czf ../sylvode-${{ matrix.suffix }}.tar.gz -- *
          cd ..
          sha256sum sylvode-${{ matrix.suffix }}.tar.gz > sylvode-${{ matrix.suffix }}.tar.gz.sha256

      # The runner archive: the executable, flat. The runner is Unix-only, so there is no Windows one.
      - name: Package runner (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging-runner
          for bin in sylvode-runner; do
            test -x target/${{ matrix.target }}/release/$bin
            cp target/${{ matrix.target }}/release/$bin staging-runner/
            chmod +x staging-runner/$bin
          done
          (cd staging-runner && tar czf ../sylvode-runner-${{ matrix.suffix }}.tar.gz -- *)
          sha256sum sylvode-runner-${{ matrix.suffix }}.tar.gz > sylvode-runner-${{ matrix.suffix }}.tar.gz.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          foreach ($bin in @("mcp-server", "sylvode")) {
            $src = "target/${{ matrix.target }}/release/$bin.exe"
            if (-not (Test-Path $src)) { throw "missing release binary: $src" }
            Copy-Item $src staging/
          }
          Compress-Archive -Path staging/* -DestinationPath sylvode-${{ matrix.suffix }}.zip
          # The same "<hash>  <file>" line sha256sum writes, so `sha256sum -c` checks it.
          $archive = "sylvode-${{ matrix.suffix }}.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$archive.sha256", "$hash  $archive`n")

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sylvode-${{ matrix.suffix }}
          path: |
            sylvode-${{ matrix.suffix }}.tar.gz
            sylvode-${{ matrix.suffix }}.tar.gz.sha256
            sylvode-${{ matrix.suffix }}.zip
            sylvode-${{ matrix.suffix }}.zip.sha256
            sylvode-runner-${{ matrix.suffix }}.tar.gz
            sylvode-runner-${{ matrix.suffix }}.tar.gz.sha256
          if-no-files-found: error

  build-frontend:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Build frontend
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build
          tar czf ../sylvode-frontend.tar.gz build/ nginx.conf
          cd ..
          sha256sum sylvode-frontend.tar.gz > sylvode-frontend.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sylvode-frontend
          path: |
            sylvode-frontend.tar.gz
            sylvode-frontend.tar.gz.sha256
          if-no-files-found: error

  # One image per architecture, each built on a native runner (no emulation), checked, and pushed
  # under a per-architecture tag. publish-runner-image joins them into the final tags.
  # Only this job and the manifest job can write packages.
  build-runner-image:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/openprx/sylvode-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build the image
        run: docker build -f apps/runner/Dockerfile -t "runner-check:${{ matrix.arch }}" .

      # The same kind of check the Image contents job in ci.yml makes for the api and worker images.
      - name: Check the image contents
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          img="runner-check:${{ matrix.arch }}"
          docker run --rm --entrypoint sh "$img" -c 'test -x /app/sylvode-runner'
          out="$(docker run --rm "$img" /app/sylvode-runner --version)"
          echo "sylvode-runner --version: $out"
          grep -qF "$version" <<<"$out" || { echo "::error::image reports '$out', not $version"; exit 1; }
          user="$(docker run --rm --entrypoint id "$img" -u)"
          test "$user" != 0 || { echo "::error::image runs as root"; exit 1; }

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Push the per-architecture image
        run: |
          set -euo pipefail
          target="$IMAGE:${RELEASE_TAG#v}-linux-${{ matrix.arch }}"
          docker tag "runner-check:${{ matrix.arch }}" "$target"
          docker push "$target"

  # Joins the two per-architecture images into a multi-platform image and publishes the final
  # tags: the release version and latest.
  publish-runner-image:
    needs: build-runner-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Create and push the multi-platform tags
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          src="ghcr.io/openprx/sylvode-runner"
          docker buildx imagetools create \
            -t "ghcr.io/openprx/sylvode-runner:$version" -t ghcr.io/openprx/sylvode-runner:latest \
            "$src:$version-linux-amd64" "$src:$version-linux-arm64"
          docker buildx imagetools inspect "ghcr.io/openprx/sylvode-runner:$version"

  # Publishes only when the version check and every build and package job succeeded; a failed
  # or cancelled leg leaves no release behind.
  release:
    needs: [verify-version, build, build-frontend, publish-runner-image]
    if: >-
      always()
      && needs.verify-version.result == 'success'
      && needs.build.result == 'success'
      && needs.build-frontend.result == 'success'
      && needs.publish-runner-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Every platform archive is present
        run: |
          set -euo pipefail
          for file in sylvode-linux-amd64.tar.gz sylvode-linux-arm64.tar.gz sylvode-macos-amd64.tar.gz \
                      sylvode-macos-arm64.tar.gz sylvode-cli-windows-amd64.zip sylvode-frontend.tar.gz \
                      sylvode-runner-linux-amd64.tar.gz sylvode-runner-linux-arm64.tar.gz \
                      sylvode-runner-macos-amd64.tar.gz sylvode-runner-macos-arm64.tar.gz; do
            test -s "artifacts/$file" || { echo "::error::missing release archive $file"; exit 1; }
            test -s "artifacts/$file.sha256" || { echo "::error::missing checksum $file.sha256"; exit 1; }
          done
          (cd artifacts && sha256sum -c ./*.sha256)
          # Flow collaborative writes need collab-isolated-apply-worker beside api, in every
          # platform archive.
          for archive in artifacts/sylvode-linux-*.tar.gz artifacts/sylvode-macos-*.tar.gz; do
            listing="$(tar tzf "$archive")"
            for bin in api collab-isolated-apply-worker; do
              grep -qx "$bin" <<<"$listing" || { echo "::error::$archive lacks $bin"; exit 1; }
            done
          done
          # The runner archives carry the runner executable.
          for archive in artifacts/sylvode-runner-*.tar.gz; do
            listing="$(tar tzf "$archive")"
            for bin in sylvode-runner; do
              grep -qx "$bin" <<<"$listing" || { echo "::error::$archive lacks $bin"; exit 1; }
            done
          done
          # The Windows archive carries only the client tools.
          for archive in artifacts/*-windows-*.zip; do
            listing="$(unzip -Z1 "$archive")"
            for bin in mcp-server.exe sylvode.exe; do
              grep -qx "$bin" <<<"$listing" || { echo "::error::$archive lacks $bin"; exit 1; }
            done
            if grep -qx 'api.exe' <<<"$listing"; then
              echo "::error::$archive must not carry server binaries"; exit 1
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sylvode ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: artifacts/*
          body: |
            ## Sylvode ${{ env.RELEASE_TAG }}

            Pre-built binaries for Sylvode (API server, Worker, MCP server, native CLI, Frontend)
            and the runner.

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `sylvode-linux-amd64.tar.gz` |
            | Linux | ARM64 | `sylvode-linux-arm64.tar.gz` |
            | macOS | Intel | `sylvode-macos-amd64.tar.gz` |
            | macOS | Apple Silicon | `sylvode-macos-arm64.tar.gz` |
            | Windows | x86_64 | `sylvode-cli-windows-amd64.zip` (CLI and MCP server only) |
            | Frontend | Static | `sylvode-frontend.tar.gz` |
            | Runner | Linux and macOS, amd64 and arm64 | `sylvode-runner-<platform>.tar.gz` |

            Each Linux and macOS archive contains `api`, `collab-isolated-apply-worker`, `worker`,
            `mcp-server`, and the `sylvode` CLI; the Windows archive contains `mcp-server.exe` and
            `sylvode.exe` only. Each has a `.sha256` file to check it (`sha256sum -c`).
            In the Linux and macOS archives keep `collab-isolated-apply-worker` in the same directory
            as `api`: the API spawns it for every Flow collaborative write.
            Each `sylvode-runner-<platform>.tar.gz` contains the `sylvode-runner` executable; there is
            no Windows build of the runner.
            The runner container image is `ghcr.io/openprx/sylvode-runner:<version>`
            (the release tag without the `v`; also `latest`), for linux/amd64 and linux/arm64.

            Before upgrading, read the "Breaking and behaviour changes" section of
            [CHANGELOG.md](https://github.com/openprx/sylvode/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md)
            for this release.

            See [README.md](https://github.com/openprx/sylvode#readme) for setup instructions.
